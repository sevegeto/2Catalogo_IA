<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatalogAI Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header svg { width: 28px; height: 28px; color: #fff; }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }

    .header .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .content { padding: 16px 20px; }

    .section { margin-bottom: 16px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .field { margin-bottom: 10px; }

    .field label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: #0ea5e9; }
    .field input::placeholder { color: #475569; }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #0ea5e9;
      color: #fff;
    }

    .btn-primary:hover { background: #0284c7; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 8px;
    }

    .btn-secondary:hover { background: #334155; }

    .status {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    .status.success { background: #052e16; color: #4ade80; display: block; }
    .status.error { background: #450a0a; color: #f87171; display: block; }
    .status.info { background: #082f49; color: #38bdf8; display: block; }

    .preview {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      display: none;
    }

    .preview.visible { display: block; }

    .preview-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 3px 0;
      color: #94a3b8;
    }

    .preview-row span:last-child {
      color: #e2e8f0;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .preview-images {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .preview-images img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .divider {
      height: 1px;
      background: #1e293b;
      margin: 16px 0;
    }

    .footer {
      padding: 10px 20px;
      background: #0b1120;
      font-size: 11px;
      color: #475569;
      text-align: center;
    }

    .footer a { color: #0ea5e9; text-decoration: none; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <h1>CatalogAI</h1>
    <span class="badge" id="conn-badge">Sin sesión</span>
  </div>

  <div class="content">
    <div class="section" id="config-section">
      <div class="section-title">Configuracion</div>
      <div class="field">
        <label>URL de Supabase</label>
        <input type="text" id="supabase-url" placeholder="https://xxx.supabase.co" />
      </div>
      <div class="field">
        <label>Anon Key</label>
        <input type="password" id="supabase-key" placeholder="eyJhbGci..." />
      </div>
      <button class="btn btn-secondary" id="save-config">Guardar configuracion</button>
    </div>

    <div class="divider"></div>

    <div class="section" id="account-section">
      <div class="section-title">Cuenta</div>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Correo</label>
          <input type="email" id="login-email" autocomplete="username" placeholder="tu@correo.com" required />
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-secondary" id="login-btn" type="submit">Iniciar sesión</button>
      </form>
      <div id="session-info" style="display:none">
        <div class="preview-row"><span>Sesión</span><span id="session-email"></span></div>
        <button class="btn btn-secondary" id="logout-btn" type="button">Cerrar sesión</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title">Captura de producto</div>
      <button class="btn btn-primary" id="capture-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Capturar producto de esta pagina
      </button>

      <div class="status" id="status"></div>

      <div class="preview" id="preview">
        <div class="preview-title" id="preview-title"></div>
        <div id="preview-rows"></div>
        <div class="preview-images" id="preview-images"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    CatalogAI Capture v1.1.0 · requiere rol editor o admin
  </div>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
